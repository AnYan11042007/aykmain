<!doctype html>
<html lang="en" data-ayk-env="dev-source">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AYK MAIN 8686 | Hệ Thống Đào Tạo & Sinh Viên Thông Minh</title>
    <meta name="description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <meta property="og:title" content="AYK MAIN 8686" />
    <meta property="og:description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- GitHub Pages Auto-Healing & SPA Routing Scripts -->
    <script type="text/javascript">
      (function() {
        var isGH = window.location.hostname.includes('github.io');
        var path = window.location.pathname;

        // 1. Ensure trailing slash on GitHub Pages directory so relative paths (./assets/...) resolve
        if (isGH && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
          return;
        }

        // 2. Decode SPA query redirect from 404.html (rafgraph/spa-github-pages)
        if (window.location.search[1] === '/') {
          var decoded = window.location.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + decoded + window.location.hash
          );
          return;
        }

        // 3. Fallback for "Deploy from branch: main -> / (root)":
        // If unbuilt dev-source HTML is loaded on github.io from root, auto-forward to compiled /docs/
        var isDevSource = document.documentElement.getAttribute('data-ayk-env') === 'dev-source';
        if (isGH && isDevSource && !path.includes('/docs')) {
          var repo = path.split('/')[1] || '';
          var target = (repo ? '/' + repo : '') + '/docs/' + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      })();
    </script>
  </head>
  <body class="bg-[#050608] text-[#e6edf3] select-none antialiased min-h-screen">
    <div id="root">
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#050608;color:#00f0ff;font-family:'JetBrains Mono',monospace;text-align:center;padding:24px;">
        <div style="font-size:26px;font-weight:900;letter-spacing:3px;margin-bottom:12px;color:#00f0ff;text-shadow:0 0 15px rgba(0,240,255,0.7);">
          AYK MAIN 8686
        </div>
        <div style="font-size:14px;color:#8b949e;margin-bottom:20px;">
          Đang khởi tạo hệ thống đào tạo thông minh...
        </div>
        <a href="./docs/" style="padding:10px 22px;background:rgba(0,240,255,0.15);border:1px solid #00f0ff;color:#ffffff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:bold;">
          Truy Cập Cổng Sinh Viên &rarr;
        </a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      (function() {
        var isGH = window.location.hostname.includes('github.io');
        var hasMainTsx = !!document.querySelector('script[src*="main.tsx"]');
        if (isGH && hasMainTsx && !window.location.pathname.includes('/docs')) {
          var repo = window.location.pathname.split('/')[1] || '';
          var target = (repo ? '/' + repo : '') + '/docs/' + window.location.search + window.location.hash;
          window.location.replace(target);
        }
      })();
    </script>
  </body>
</html>
