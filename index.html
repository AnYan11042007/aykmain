<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AYK MAIN 8686 | Hệ Thống Đào Tạo & Sinh Viên Thông Minh</title>
    <meta name="description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <meta property="og:title" content="AYK MAIN 8686" />
    <meta property="og:description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- GitHub Pages Auto-Healing & SPA Routing Scripts -->
    <script type="text/javascript">
      (function() {
        var isGH = window.location.hostname.includes('github.io');
        var path = window.location.pathname;

        // 1. Ensure trailing slash on GitHub Pages directory so relative paths (./assets/...) resolve
        if (isGH && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
          return;
        }

        // 2. Decode SPA query redirect from 404.html (rafgraph/spa-github-pages)
        if (window.location.search[1] === '/') {
          var decoded = window.location.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + decoded + window.location.hash
          );
        }

        // 3. Fallback for "Deploy from branch: main -> / (root)":
        // If unbuilt index.html is loaded from root on GitHub Pages, redirect to compiled /docs/
        if (isGH && !path.includes('/docs')) {
          // Check if we are running the uncompiled version (root index.html containing /src/main.tsx)
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i++) {
            if (scripts[i].src && scripts[i].src.includes('/src/main.tsx')) {
              var repo = path.split('/')[1] || '';
              var target = repo ? '/' + repo + '/docs/' : '/docs/';
              window.location.replace(target + window.location.search + window.location.hash);
              break;
            }
          }
        }
      })();
    </script>
  </head>
  <body class="bg-[#050608] text-[#e6edf3] select-none antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
