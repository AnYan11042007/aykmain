<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AYK MAIN 8686 | Hệ Thống Đào Tạo & Sinh Viên Thông Minh</title>
    <meta name="description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <meta property="og:title" content="AYK MAIN 8686" />
    <meta property="og:description" content="Secure, high-performance, and gamified student portal AYK MAIN 8686 with real-time activities and news." />
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  </head>
  <body class="bg-[#050608] text-[#e6edf3] select-none antialiased min-h-screen">
    <div id="root">
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#050608;color:#00f0ff;font-family:'JetBrains Mono',monospace;text-align:center;padding:24px;">
        <div style="font-size:26px;font-weight:900;letter-spacing:3px;margin-bottom:12px;color:#00f0ff;text-shadow:0 0 15px rgba(0,240,255,0.7);">
          AYK MAIN 8686
        </div>
        <div id="ayk-init-status" style="font-size:14px;color:#8b949e;margin-bottom:20px;">
          Đang khởi tạo hệ thống đào tạo thông minh...
        </div>
      </div>
    </div>
    <script>
      // Diagnostic helper: If main app fails to load after 5 seconds (e.g. raw source served on GitHub Pages without build)
      setTimeout(function() {
        var el = document.getElementById('ayk-init-status');
        var root = document.getElementById('root');
        if (el && root && root.children.length === 1) {
          el.innerHTML = '<div style="background:rgba(255,68,68,0.15);border:1px solid #ff4444;border-radius:8px;padding:16px;max-width:520px;text-align:left;color:#fff;font-family:sans-serif;box-shadow:0 0 20px rgba(255,0,0,0.2);">' +
            '<div style="color:#ff4444;font-weight:bold;font-size:15px;margin-bottom:8px;">⚠️ Trang web đang chạy file nguồn chưa build!</div>' +
            '<div style="font-size:13px;line-height:1.6;color:#e6edf3;">GitHub Pages đang phát trực tiếp file gốc của repo thay vì bản build. Hãy làm theo 2 bước sau:' +
            '<ol style="margin:8px 0 0 18px;padding:0;">' +
            '<li>Vào <b>GitHub Repo &rarr; Settings &rarr; Pages</b>, tại mục <b>Source</b> chọn <b>GitHub Actions</b>.</li>' +
            '<li>Vào tab <b>Actions &rarr; Deploy to GitHub Pages &rarr; Run workflow</b> (chọn branch <code>main</code>), chờ dấu tích xanh ✔ rồi F5 lại.</li>' +
            '</ol></div>' +
            '</div>';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
